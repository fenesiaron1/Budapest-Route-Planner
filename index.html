<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="https://openlayers.org/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budapest Route Planner</title>
  </head>
  <body>
    <div id="map"></div>

    <button id="savedToggleBtn" title="Saved places">&#9776;</button>

    <div id="savedPanel">
      <h3>Saved places</h3>

      <div class="saved-row" id="themeRow">
        <span class="saved-label">Theme</span>
        <label><input type="radio" name="theme" value="light" checked> Light</label>
        <label><input type="radio" name="theme" value="dark"> Dark</label>
      </div>
      <div class="saved-row" data-type="home">
        <span class="saved-label">Home</span>
        <button class="saved-action">Add</button>
        <button class="saved-delete" hidden>Delete</button>
      </div>
      <div class="saved-row" data-type="workplace">
        <span class="saved-label">Workplace</span>
        <button class="saved-action">Add</button>
        <button class="saved-delete" hidden>Delete</button>
      </div>
      <div class="saved-row" data-type="study">
        <span class="saved-label">Study</span>
        <button class="saved-action">Add</button>
        <button class="saved-delete" hidden>Delete</button>
      </div>
      <div class="saved-row" data-type="favorite">
        <span class="saved-label">Favorite</span>
        <button class="saved-action">Add</button>
        <button class="saved-delete" hidden>Delete</button>
      </div>

      <div id="stationInfo" hidden>
        <hr>
        <h3 id="stationName"></h3>
        <div id="stationType"></div>
        <div id="stationDescription"></div>
      </div>
      
    </div>

    <div id="controls">
      <button id="planBtn">Plan route</button>
      <button id="clearBtn">Clear</button>
    </div>

    <div id="panel">
      <div class="profile-options">
        <label class="profile-option">
          <input type="radio" name="profile" value="walking" checked>
          <span>Walking</span>
        </label>
        <label class="profile-option">
          <input type="radio" name="profile" value="transit">
          <span>Transit</span>
        </label>
        <label class="profile-option">
          <input type="radio" name="profile" value="driving">
          <span>Driving</span>
        </label>
      </div>
      <div id="routeRecommendation">Route recommendation</div>
      <div>[<span id="transportMode"></span>]</div>
      <div>Start: <span id="startCoord"></span></div>
      <div>End: <span id="endCoord"></span></div>
      <div>Distance: <span id="distance"></span></div>
      <div>Time: <span id="duration"></span></div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
